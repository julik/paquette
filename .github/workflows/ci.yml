name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Two parts of this suite drive tooling that is not Ruby: the npm CLI, and
      # a container running it against a Paquette on the host. Both skip
      # themselves when the tooling is missing, which is right on a laptop and
      # wrong here — a skip is indistinguishable from a pass in the summary, so
      # the day a runner image drops docker or node the registry stops being
      # tested and nothing says so. These turn that skip into a failure.
      PAQUETTE_REQUIRE_NPM: "1"
      PAQUETTE_REQUIRE_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      # ubuntu-latest ships a node, but which one moves with the runner image.
      # Pinning it means an npm behaviour change arrives when this file changes.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The container talks to the host through host.docker.internal, which
      # Docker on Linux only resolves because the tests pass
      # --add-host=host.docker.internal:host-gateway. Printing the versions
      # makes an environment failure legible in the log rather than showing up
      # as an unexplained npm error further down.
      - name: Show tooling versions
        run: |
          ruby --version
          node --version
          npm --version
          docker --version
          docker info --format 'Docker: {{.ServerVersion}} on {{.OperatingSystem}}'

      - run: bundle exec rake test

      - run: bundle exec rake standard
