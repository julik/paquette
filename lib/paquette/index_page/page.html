<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&family=Archivo+Black&family=Crimson+Pro:ital,wght@0,400;0,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --sand: #f2e7d3;
    --cream: #fcf6ea;
    --ink: #17130f;
    --ink-soft: #5c5147;
    --orange: #d9531e;
    --orange-hover: #c24514;
    --line-muted: #c9bfae;

    --font-display: "Archivo Black", "Helvetica Neue", Arial, sans-serif;
    --font-body: "Crimson Pro", Georgia, "Times New Roman", serif;
    --font-label: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--sand);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: clamp(1.0625rem, 1rem + 0.3vw, 1.125rem);
    line-height: 1.6;
  }

  main {
    max-width: 42rem;
    margin: 0 auto;
    padding: clamp(2.5rem, 8vw, 6rem) 1.5rem clamp(2rem, 6vw, 4rem);
    text-align: center;
  }

  /* The wordmark is the heading. It sets its own width against the measure,
     so it stays a mark rather than growing into a banner. */
  .masthead {
    /* Lengths in rem, kept as bare numbers so the shift below can divide by
       them: CSS cannot divide one length by another. */
    --masthead-max: 26;
    /* The ink sits right of the viewBox centre — the trailing flourish of the
       final "e" runs out further than the "P" reaches back — so a box-centred
       mark reads as shifted right. This is the fraction of its own width the
       mark comes back by on a wide screen. */
    --masthead-optical-shift: 0.1;
    /* The correction only reads as a correction with gutter on both sides of
       the mark. Below the first viewport width the mark is centred, past the
       second it gets the full shift, and in between it slides linearly. */
    --masthead-ramp-from: 30;
    --masthead-ramp-to: 48;

    display: block;
    width: min(100%, var(--masthead-max) * 1rem);
    height: auto;
    /* auto side margins rather than text-align: an inline-block mark would
       sit on the text baseline and carry its descender gap with it. */
    margin: 0 auto clamp(2rem, 5vw, 3rem);
    /* The ramp starts above the width where the mark stops growing, so the
       mark is always at its 26rem cap while it is being shifted, and the
       shift never eats more than the gutter it has. */
    transform: translateX(calc(-1 * clamp(
      0rem,
      (100vw - var(--masthead-ramp-from) * 1rem)
        * var(--masthead-max) * var(--masthead-optical-shift)
        / (var(--masthead-ramp-to) - var(--masthead-ramp-from)),
      var(--masthead-max) * var(--masthead-optical-shift) * 1rem
    )));
  }

  .masthead path { fill: var(--ink); }

  /* The one line the server templates in. Sized as a lede, because on this
     page it is the whole of the copy. */
  .blurb {
    margin: 0 auto;
    font-size: clamp(1.125rem, 1rem + 0.7vw, 1.3125rem);
    line-height: 1.45;
    max-width: 38rem;
  }

  .rule {
    border: 0;
    border-top: 2px solid var(--ink);
    margin: clamp(2rem, 5vw, 3rem) 0 1.25rem;
  }

  footer {
    font-family: var(--font-label);
    font-size: 0.875rem;
    line-height: 1.45;
    color: var(--ink-soft);
  }

  a {
    color: var(--orange);
    text-decoration-thickness: 1px;
    text-underline-offset: 0.18em;
  }

  a:hover { color: var(--orange-hover); }

  @media (prefers-color-scheme: dark) {
    :root {
      --sand: #17130f;
      --ink: #f2e7d3;
      --ink-soft: #c9bfb2;
      --orange: #efa23f;
      --orange-hover: #f5b862;
    }
  }
</style>

<main>
  {{masthead}}

  <p class="blurb">{{blurb}}</p>

  <hr class="rule">

  <footer>
    <!-- No version, here or in a header: naming the build is handing a
         scanner the list of exploits that work on it. -->
    <span>Served by <a href="https://github.com/julik/paquette">Paquette</a>, a slightly unhinged package registry. A <a href="https://stanquette.nl">Stanquette</a> joint.</span>
  </footer>
</main>
